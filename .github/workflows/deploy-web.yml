name: Deploy Statstrade web apps

on:
  repository_dispatch:
    types: [app-changed]
  workflow_dispatch:
    inputs:
      root_sha:
        description: Optional statstrade-v2 commit to deploy
        required: false
        type: string
      app_sha:
        description: Optional statstrade-v2-app commit to deploy
        required: false
        type: string

concurrency:
  group: statstrade-web-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout statstrade-v2
        uses: actions/checkout@v4
        with:
          repository: statstrade-dev/statstrade-v2
          ref: ${{ inputs.root_sha || github.event.client_payload.root_sha || 'main' }}
          path: statstrade-v2
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          submodules: false

      - name: Checkout Foundation at the recorded commit
        working-directory: statstrade-v2
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive ref/foundation
          expected="$(git rev-parse HEAD:ref/foundation)"
          actual="$(git -C ref/foundation rev-parse HEAD)"
          test "${expected}" = "${actual}"
          echo "ref/foundation: ${actual}"

      - name: Resolve application revision
        id: app-revision
        working-directory: statstrade-v2
        env:
          APP_SHA: ${{ inputs.app_sha || github.event.client_payload.app_sha || '' }}
        run: |
          set -euo pipefail
          app_sha="${APP_SHA}"
          if [ -z "${app_sha}" ]; then
            app_sha="$(git rev-parse HEAD:js/statstrade-app)"
          fi
          echo "app_sha=${app_sha}" >> "${GITHUB_OUTPUT}"
          echo "js/statstrade-app: ${app_sha}"

      - name: Checkout statstrade-v2-app
        uses: actions/checkout@v4
        with:
          repository: statstrade-dev/statstrade-v2-app
          ref: ${{ steps.app-revision.outputs.app_sha }}
          path: statstrade-v2/js/statstrade-app
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1
          submodules: false

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USER }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Generate frontend sources
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            -w "${{ github.workspace }}" \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            ghcr.io/zcaudate-xyz/infra-foundation-dev:ci \
            bash -lc '
              set -euo pipefail
              cd statstrade-v2/ref/foundation
              lein install
              cd ../..
              mkdir -p checkouts
              ln -s ../ref/foundation checkouts/foundation
              lein run -m statsbuild.project.main libs pages
            '

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: statstrade-v2/js/statstrade-app
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.9.4 --activate
          test "$(yarn --version)" = "4.9.4"
          yarn install --immutable

      - name: Deploy web-main
        working-directory: statstrade-v2/js/statstrade-app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_WEB_MAIN_SITE_ID }}
        run: |
          set -euo pipefail
          test -n "${NETLIFY_SITE_ID}"
          yarn netlify deploy \
            --prod \
            --site "${NETLIFY_SITE_ID}" \
            --filter site/web-main \
            --message "web-main ${GITHUB_SHA}" \
            --debug

      - name: Deploy web-superadmin
        working-directory: statstrade-v2/js/statstrade-app
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_WEB_SUPERADMIN_SITE_ID }}
        run: |
          set -euo pipefail
          test -n "${NETLIFY_SITE_ID}"
          yarn netlify deploy \
            --prod \
            --site "${NETLIFY_SITE_ID}" \
            --filter site/web-superadmin \
            --message "web-superadmin ${GITHUB_SHA}" \
            --debug
